<div
  class="border border-dark border-4 p-3 h-100 d-flex flex-column"
  style="background-color: #9cb4d4"
>
  <div class="border border-dark bg-secondary flex-grow-1 p-1">
    <div class="table-responsive bg-white h-100" style="min-height: 200px">
      <table class="table table-bordered table-sm text-center mb-0">
        <thead>
          <tr>
            <th>Tamaño</th>
            <th>Ingredientes</th>
            <th>Num. Pizzas</th>
            <th>SubTotal</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let pizza of pizzas; let i = index">
            <td>{{ pizza.tamano }}</td>
            <td>{{ pizza.ingredientes.join(', ') }}</td>
            <td>{{ pizza.num_pizzas }}</td>
            <td>${{ pizza.subtotal }}</td>
            <td>
              <button
                class="btn btn-sm btn-danger py-0"
                (click)="quitarPizza(i)"
              >
                X
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="d-flex justify-content-between mt-3 px-4">
    <!-- El botón quitar está en la tabla (X), pero dejamos este por estética del examen -->
    <button
      class="btn btn-light px-4 border border-dark"
      type="button"
      (click)="quitarUltimaPizza()"
    >
      Quitar
    </button>
    <button
      class="btn btn-light px-4 border border-dark"
      (click)="terminarPedido()"
    >
      Terminar
    </button>
  </div>
</div>
