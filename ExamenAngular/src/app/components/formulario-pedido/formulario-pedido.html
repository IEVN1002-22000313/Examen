<div class="border border-danger border-3 p-4 mb-3" style="background-color: #9cb4d4">
  <form [formGroup]="pedidoForm">
    <div
      *ngIf="mostrarAlertaAgregado"
      class="modal-backdrop d-block"
      style="background: rgba(0, 0, 0, 0.16); position: fixed; inset: 0; z-index: 1050"
    >
      <div class="modal-dialog modal-dialog-centered" style="max-width: 600px; margin: 6vh auto 0">
        <div
          class="modal-content border-0 shadow-lg"
          style="background: rgba(255, 255, 255, 0.97); border-radius: 10px; min-height: 110px"
        >
          <div class="modal-body d-flex flex-column justify-content-center px-3 py-2">
            <div class="fw-semibold text-dark mb-2" style="font-size: 0.9rem">
              localhost:4200 dice
            </div>
            <div class="d-flex align-items-center justify-content-between gap-3">
              <div class="text-dark" style="font-size: 0.95rem">{{ mensajeAccion }}</div>
              <button
                type="button"
                class="btn btn-primary rounded-pill px-4 py-2 fw-bold"
                style="background-color: #0d6efd; border: none; min-width: 110px; font-size: 0.9rem"
                (click)="cerrarAlertaAgregado()"
              >
                Aceptar
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Fila de Datos del Cliente -->
    <div class="row mb-4 align-items-center text-center text-md-start">
      <div class="col-md-3">
        <label class="fw-bold me-2">Nombre:</label>
        <input
          type="text"
          class="form-control d-inline-block w-auto"
          formControlName="nombre"
          placeholder="Ej. Mario Juarez"
        />
      </div>
      <div class="col-md-3">
        <label class="fw-bold me-2">Dirección:</label>
        <input
          type="text"
          class="form-control d-inline-block w-auto"
          formControlName="direccion"
          placeholder="Ej. 5 de mayo col. Centro"
        />
      </div>
      <div class="col-md-3">
        <label class="fw-bold me-2">Teléfono:</label>
        <input
          type="text"
          class="form-control d-inline-block w-auto"
          formControlName="telefono"
          placeholder="Ej. 477-787-23-40"
        />
      </div>
      <div class="col-md-3">
        <label class="fw-bold me-2">Fecha:</label>
        <input type="date" class="form-control d-inline-block w-auto" formControlName="fecha" />
      </div>
    </div>

    <!-- Fila de Selección de Pizza -->
    <div class="row align-items-stretch">
      <div class="col-md-4">
        <div class="border border-light p-3 h-100 text-start">
          <p class="mb-2 fw-bold">Tamaño Pizza</p>
          <div class="form-check">
            <input class="form-check-input" type="radio" formControlName="tamano" value="Chica" />
            <label class="form-check-label">Chica $40</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" formControlName="tamano" value="Mediana" />
            <label class="form-check-label">Mediana $80</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" formControlName="tamano" value="Grande" />
            <label class="form-check-label">Grande $120</label>
          </div>
        </div>
      </div>

      <div class="col-md-4">
        <div class="border border-light p-3 h-100 text-start">
          <p class="mb-2 fw-bold">Ingredientes</p>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" formControlName="jamon" />
            <label class="form-check-label">Jamón $10</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" formControlName="pina" />
            <label class="form-check-label">Piña $10</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" formControlName="champinones" />
            <label class="form-check-label">Champiñones $10</label>
          </div>
        </div>
      </div>

      <div class="col-md-4 d-flex flex-column align-items-center justify-content-center">
        <div class="mb-3 text-center">
          <label class="fw-bold d-block mb-1">Num. de Pizzas:</label>
          <input
            type="number"
            class="form-control mx-auto text-center"
            style="width: 80px"
            formControlName="num_pizzas"
          />
        </div>
        <button
          type="button"
          class="btn btn-light px-4 border border-dark"
          (click)="agregarPizza()"
        >
          Agregar
        </button>
      </div>
    </div>
  </form>
</div>
